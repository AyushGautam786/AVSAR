services:
  # ── 1. Flask API — Render Web Service ──────────────────────────────────────
  - type: web
    name: avsar-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn flask_api:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false   # Paste your Supabase project URL (https://xxxx.supabase.co)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Paste your Supabase service_role secret key
      - key: SUPABASE_JWT_SECRET
        sync: false   # Paste from Supabase Settings -> API -> JWT Secret
      - key: LLM_PROVIDER
        value: groq   # groq / gemini / anthropic / openai
      - key: GROQ_API_KEY
        sync: false   # Paste your free Groq API key from https://console.groq.com/keys
      - key: GEMINI_API_KEY
        sync: false   # Optional: Google AI Studio key
      - key: APIFY_API_TOKEN
        sync: false   # Optional: Apify token for live scraper
      - key: RESUME_STORAGE_BUCKET
        value: resumes
      - key: SUPABASE_STORAGE_BUCKET_RESUMES
        value: resumes
      - key: CORS_ORIGIN
        sync: false   # Optional: Custom domain (Render subdomains are auto-permitted)

  # ── 2. React Frontend — Render Static Site ─────────────────────────────────
  - type: web
    name: avsar-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: avsar-backend
          property: url
      - key: VITE_SUPABASE_URL
        sync: false   # Paste Supabase URL (same as backend)
      - key: VITE_SUPABASE_KEY
        sync: false   # Paste Supabase anon public key
