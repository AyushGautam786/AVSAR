name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: backend
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_JWT_SECRET: super-secret-test-jwt-secret-at-least-32-chars!!
          CORS_ORIGIN: http://localhost:5173
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_KEY: placeholder-anon-key
          VITE_API_URL: https://placeholder-api.onrender.com
        run: npm run build

      - name: Check no hardcoded localhost
        working-directory: frontend
        run: |
          if grep -r "localhost:5000" src/; then
            echo "ERROR: hardcoded localhost:5000 found in frontend source"
            exit 1
          fi
          echo "✓ No hardcoded localhost found"
